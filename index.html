<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apricity Art — Arte Artesanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#F6EBDD;font-family:'Jost',sans-serif;color:#3D2E24;overflow-x:hidden;transition:background 0.3s,color 0.3s}

:root{
  --bege:#F6EBDD;--bege-dark:#EAD9C4;--laranja:#F3B343;--rosa:#F2B6A0;
  --verde:#7C8B5A;--marrom:#6B584C;--marrom-dark:#3D2E24;
  --texto:#3D2E24;--texto-suave:#7A6155;--branco:#FFFFFF;
  --card-bg:#FFFFFF;--header-bg:rgba(246,235,221,0.93);--section-bg:#F6EBDD;
}
body.dark{
  --bege:#1C1510;--bege-dark:#2A1F18;--laranja:#F3B343;--rosa:#D4957F;
  --verde:#8FA56A;--marrom:#C9A882;--marrom-dark:#F0DFC8;
  --texto:#F0DFC8;--texto-suave:#A8917E;--branco:#241A14;
  --card-bg:#2A1F18;--header-bg:rgba(28,21,16,0.95);--section-bg:#1C1510;
}
body.dark{background:#1C1510;color:#F0DFC8}
body.dark .section-white{background:#221810}
body.dark .category-card,body.dark .product-card,body.dark .faq-item{background:#2A1F18;border-color:rgba(200,168,130,0.15)}
body.dark .header-search{background:#2A1F18;border-color:rgba(200,168,130,0.2)}
body.dark .header-search input{color:#F0DFC8}
body.dark .about-wrapper{background:#2A1F18;border-color:rgba(200,168,130,0.1)}
body.dark .contact-link{background:#2A1F18}
body.dark .form-group input,body.dark .form-group textarea{background:#2A1F18;border-color:rgba(200,168,130,0.2);color:#F0DFC8}
body.dark .mobile-menu{background:#1C1510}
body.dark .whatsapp-float-bubble{background:#2A1F18;color:#F0DFC8}

.serif{font-family:'Playfair Display',serif}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--marrom);color:var(--bege);border:none;border-radius:28px;padding:13px 30px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.04em;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(107,88,76,.28)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--marrom);border:1.5px solid var(--marrom);border-radius:28px;padding:11px 26px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s}
.btn-secondary:hover{background:var(--bege-dark)}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(107,88,76,.12);padding:0 2rem;height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:background .3s}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-img{height:44px;width:auto;object-fit:contain}
.logo-sun{cursor:pointer;transition:transform .1s;width:32px;height:32px;display:none}
.logo-sun.spinning{animation:spin-sun-fast 0.6s linear}
@keyframes spin-sun-fast{to{transform:rotate(360deg)}}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:13px;color:var(--texto-suave);text-decoration:none;font-weight:400;letter-spacing:.03em;transition:color .2s}
.nav-links a:hover{color:var(--marrom)}
.header-search{display:flex;align-items:center;background:var(--branco);border:1px solid rgba(107,88,76,.18);border-radius:24px;padding:6px 14px;gap:8px;width:210px;position:relative}
.header-search input{border:none;outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:13px;color:var(--texto);width:100%}
.header-search input::placeholder{color:var(--texto-suave)}
.header-search i{font-size:14px;color:var(--texto-suave)}
.search-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card-bg);border:1px solid rgba(107,88,76,.15);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.1);z-index:200;display:none;overflow:hidden}
.search-dropdown.visible{display:block}
.search-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:background .15s;font-size:13px;color:var(--texto)}
.search-item:hover{background:var(--bege-dark)}
.search-item-img{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--bege-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.search-item-img img{width:100%;height:100%;object-fit:cover}
.search-item-info{flex:1}
.search-item-name{font-weight:500;font-size:13px}
.search-item-price{font-size:11px;color:var(--texto-suave)}
.search-no-results{padding:14px;text-align:center;font-size:13px;color:var(--texto-suave)}
.header-icons{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-icon-btn{background:none;border:none;cursor:pointer;color:var(--marrom);font-size:20px;display:flex;align-items:center;padding:7px;border-radius:50%;transition:background .2s;position:relative}
.header-icon-btn:hover{background:var(--bege-dark)}
.cart-badge{position:absolute;top:2px;right:2px;width:15px;height:15px;background:var(--laranja);border-radius:50%;font-size:9px;color:white;display:flex;align-items:center;justify-content:center;font-weight:600;border:1.5px solid var(--bege)}
.lang-btn{background:var(--bege-dark);border:1px solid rgba(107,88,76,.2);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--marrom);cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:.04em;transition:background .2s}
.lang-btn:hover{background:var(--laranja);color:white}
.dark-btn{background:none;border:none;cursor:pointer;color:var(--marrom);font-size:20px;padding:7px;border-radius:50%;transition:background .2s}
.dark-btn:hover{background:var(--bege-dark)}
.hamburger{display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:7px;background:none;border:none}
.hamburger span{display:block;width:20px;height:1.5px;background:var(--marrom);border-radius:2px;transition:.3s}

/* MOBILE MENU */
.overlay{position:fixed;inset:0;background:rgba(61,46,36,.45);z-index:190;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.mobile-menu{position:fixed;top:0;right:-290px;bottom:0;width:280px;background:var(--bege);z-index:200;padding:24px;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 40px rgba(107,88,76,.18)}
.mobile-menu.open{right:0}
.mobile-menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.mobile-menu-logo{height:36px;width:auto}
.close-btn{background:none;border:none;font-size:22px;color:var(--marrom);cursor:pointer;padding:4px}
.mobile-nav{display:flex;flex-direction:column}
.mobile-nav a{font-family:'Playfair Display',serif;font-size:22px;color:var(--marrom);text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(107,88,76,.1);transition:color .2s,padding-left .2s}
.mobile-nav a:hover{color:#C47A2A;padding-left:6px}
.mobile-social{display:flex;gap:10px;margin-top:24px}
.mobile-social a{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:18px;text-decoration:none;color:white;transition:transform .2s}
.mobile-social a:hover{transform:scale(1.1)}
.mobile-social .ig{background:#E1306C}
.mobile-social .wa{background:#25D366}

/* HERO / BANNER */
.hero{position:relative;overflow:hidden}
.hero-banner{width:100%;display:block;max-height:400px;object-fit:cover;object-position:center}
.hero-overlay-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:3rem 4rem;background:linear-gradient(90deg,rgba(246,235,221,0.55) 0%,transparent 60%)}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(243,179,67,.18);border:1px solid rgba(243,179,67,.45);border-radius:20px;padding:5px 15px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8B6A1E;margin-bottom:1.25rem;font-weight:500}
.hero-overlay-content h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,48px);line-height:1.15;color:var(--marrom);margin-bottom:.8rem;font-weight:700}
.hero-overlay-content h1 em{font-style:italic;color:#C47A2A}
.hero-sub{font-size:14px;color:var(--texto-suave);line-height:1.7;margin-bottom:1.5rem;max-width:360px;font-weight:300}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-badges{display:flex;gap:18px;margin-top:1.5rem;flex-wrap:wrap}
.hero-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texto-suave)}
.hero-badge i{font-size:15px;color:var(--verde)}

/* SECTION */
.section{padding:4.5rem 2rem}
.section-white{background:var(--branco)}
.section-header{text-align:center;margin-bottom:2.8rem}
.section-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--verde);font-weight:500;margin-bottom:8px;display:block}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(24px,3.5vw,36px);color:var(--marrom);font-weight:700;line-height:1.2}
.section-title em{font-style:italic;color:#C47A2A}
.section-sub{font-size:14px;color:var(--texto-suave);margin-top:8px}
.divider-bar{width:48px;height:2.5px;background:linear-gradient(90deg,var(--laranja),var(--rosa));border-radius:3px;margin:12px auto 0}

/* CATEGORIES */
.categories-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.category-card{background:var(--card-bg);border-radius:20px;padding:1.6rem 1rem;text-align:center;border:1px solid rgba(107,88,76,.09);cursor:pointer;transition:transform .25s,box-shadow .25s;text-decoration:none;display:block}
.category-card:hover{transform:translateY(-5px);box-shadow:0 18px 44px rgba(107,88,76,.12)}
.cat-icon{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px}
.category-card h3{font-size:13px;font-weight:500;color:var(--marrom)}
.category-card p{font-size:11px;color:var(--texto-suave);margin-top:3px}

/* PRODUCTS */
.products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.product-card{background:var(--card-bg);border-radius:20px;overflow:hidden;border:1px solid rgba(107,88,76,.09);transition:transform .25s,box-shadow .25s;cursor:pointer;display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-6px);box-shadow:0 22px 52px rgba(107,88,76,.15)}
.product-img{position:relative;overflow:hidden;height:200px;display:flex;align-items:center;justify-content:center;font-size:64px}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-img .placeholder-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--texto-suave)}
.product-img .placeholder-wrap .emoji{font-size:48px}
.product-img .placeholder-wrap .photo-hint{font-size:10px;text-align:center;padding:0 12px;line-height:1.4;opacity:.7}
.product-badge{position:absolute;top:12px;left:12px;background:var(--marrom);color:var(--bege);font-size:10px;padding:3px 10px;border-radius:12px;font-weight:500;letter-spacing:.06em}
.product-fav{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;transition:transform .2s}
.product-fav:hover{transform:scale(1.15)}
.product-fav i{transition:color .2s}
.product-fav .ti-star{color:#ccc}
.product-fav.faved .ti-star{color:#F3B343}
.product-fav.faved .ti-star::before{content:"\eac1"}
.product-info{padding:14px 16px;flex:1}
.product-cat{font-size:11px;color:var(--verde);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.product-name{font-family:'Playfair Display',serif;font-size:16px;color:var(--marrom);font-weight:500;margin-top:3px;margin-bottom:5px}
.product-desc{font-size:12px;color:var(--texto-suave);line-height:1.55}
.product-footer{display:flex;align-items:center;justify-content:space-between;padding:0 16px 15px}
.product-price{font-family:'Playfair Display',serif;font-size:18px;color:var(--marrom);font-weight:700}
.add-btn{background:var(--laranja);border:none;border-radius:20px;padding:8px 14px;font-family:'Jost',sans-serif;font-size:12px;color:white;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:5px;transition:filter .2s,transform .15s}
.add-btn:hover{filter:brightness(1.08);transform:scale(1.04)}

/* CART SIDEBAR */
.cart-sidebar{position:fixed;top:0;right:-360px;bottom:0;width:340px;background:var(--bege);z-index:300;padding:24px;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 40px rgba(107,88,76,.2);overflow-y:auto}
.cart-sidebar.open{right:0}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.cart-header h3{font-family:'Playfair Display',serif;font-size:22px;color:var(--marrom)}
.cart-empty{text-align:center;padding:3rem 1rem;color:var(--texto-suave);font-size:14px}
.cart-empty i{font-size:48px;display:block;margin-bottom:12px;opacity:.4}
.cart-items{display:flex;flex-direction:column;gap:12px}
.cart-item{background:var(--card-bg);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;border:1px solid rgba(107,88,76,.09)}
.cart-item-img{width:52px;height:52px;border-radius:10px;background:var(--bege-dark);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-family:'Playfair Display',serif;font-size:14px;color:var(--marrom);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price{font-size:13px;color:var(--texto-suave);margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(107,88,76,.25);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--marrom);transition:background .15s;font-weight:600}
.qty-btn:hover{background:var(--laranja);color:white;border-color:var(--laranja)}
.qty-num{font-size:14px;font-weight:600;color:var(--marrom);min-width:18px;text-align:center}
.cart-remove{background:none;border:none;cursor:pointer;color:var(--rosa);font-size:18px;padding:4px;flex-shrink:0;opacity:.7;transition:opacity .2s}
.cart-remove:hover{opacity:1}
.cart-footer{margin-top:24px;padding-top:16px;border-top:1px solid rgba(107,88,76,.12)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-family:'Playfair Display',serif;font-size:18px;color:var(--marrom);font-weight:700}
.cart-checkout{width:100%;background:var(--marrom);color:var(--bege);border:none;border-radius:24px;padding:14px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,box-shadow .2s}
.cart-checkout:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(107,88,76,.25)}
body.dark .cart-sidebar{background:#1C1510}
body.dark .cart-item{background:#2A1F18;border-color:rgba(200,168,130,.15)}

/* FAVORITES SECTION */
.fav-section{background:rgba(243,179,67,.07);border:1px solid rgba(243,179,67,.2);border-radius:20px;padding:20px;margin-bottom:28px;display:none}
.fav-section.has-favs{display:block}
.fav-section-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--marrom);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fav-section-title i{color:#F3B343}
.fav-chips{display:flex;flex-wrap:wrap;gap:8px}
.fav-chip{display:flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid rgba(107,88,76,.12);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--marrom);cursor:pointer;transition:background .2s}
.fav-chip:hover{background:var(--bege-dark)}

/* ABOUT */
.about-wrapper{background:var(--card-bg);border-radius:28px;padding:3.5rem 3rem;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;border:1px solid rgba(107,88,76,.09);margin:0 2rem 0}
.about-title{font-family:'Playfair Display',serif;font-size:30px;color:var(--marrom);font-weight:700;line-height:1.25;margin:8px 0 18px}
.about-title em{font-style:italic;color:#C47A2A}
.about-body{font-size:14px;color:var(--texto-suave);line-height:1.9}
.about-body p{margin-bottom:12px}
.about-stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap}
.about-stat .num{display:block;font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--marrom)}
.about-stat .lbl{font-size:11px;color:var(--texto-suave)}
.about-visual{background:var(--bege);border-radius:20px;height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* SOCIAL */
.social-section{background:var(--marrom);border-radius:28px;padding:3rem;margin:4rem 2rem 0;display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.social-section-text h2{font-family:'Playfair Display',serif;font-size:26px;color:var(--bege);font-weight:700;margin-bottom:8px}
.social-section-text p{font-size:14px;color:rgba(246,235,221,.65)}
.social-btns{display:flex;gap:12px;flex-wrap:wrap}
.social-btn-pill{display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:28px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;text-decoration:none;transition:transform .2s,filter .2s}
.social-btn-pill:hover{transform:translateY(-2px);filter:brightness(1.08)}
.social-btn-pill i{font-size:20px}
.btn-wa{background:#25D366;color:white}
.btn-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:white}
.btn-pt{background:#E60023;color:white}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
.contact-left h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--marrom);font-weight:700;margin:8px 0 14px}
.contact-left p{font-size:14px;color:var(--texto-suave);line-height:1.7;margin-bottom:20px}
.contact-links{display:flex;flex-direction:column;gap:10px}
.contact-link{display:flex;align-items:center;gap:12px;background:var(--bege);border:1px solid rgba(107,88,76,.12);border-radius:14px;padding:12px 16px;color:var(--marrom);font-size:14px;cursor:pointer;transition:background .2s,transform .2s;font-family:'Jost',sans-serif;text-decoration:none}
.contact-link:hover{background:var(--bege-dark);transform:translateX(4px)}
.contact-link i{font-size:20px;flex-shrink:0}
.contact-link.link-wa i{color:#25D366}
.contact-link.link-ig i{color:#E1306C}
.contact-link.link-pt i{color:#E60023}
.contact-form{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;color:var(--texto-suave);font-weight:500}
.form-group input,.form-group textarea{width:100%;background:var(--bege);border:1px solid rgba(107,88,76,.18);border-radius:12px;padding:11px 14px;font-family:'Jost',sans-serif;font-size:13px;color:var(--texto);outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input::placeholder,.form-group textarea::placeholder{color:rgba(107,88,76,.45)}
.form-group input:focus,.form-group textarea:focus{border-color:var(--laranja);box-shadow:0 0 0 3px rgba(243,179,67,.12)}
.form-group textarea{resize:none;height:100px}
.form-send{background:var(--marrom);color:var(--bege);border:none;border-radius:24px;padding:13px 28px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;width:fit-content;transition:transform .2s,box-shadow .2s}
.form-send:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(107,88,76,.25)}

/* FAQ */
.faq-list{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--card-bg);border-radius:16px;border:1px solid rgba(107,88,76,.1);overflow:hidden}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--marrom);background:none;border:none;width:100%;text-align:left;font-family:'Jost',sans-serif;transition:background .2s}
.faq-q:hover{background:rgba(246,235,221,.7)}
.faq-q i{font-size:18px;color:var(--verde);transition:transform .3s;flex-shrink:0}
.faq-q.open i{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .38s ease,padding .25s;font-size:13px;color:var(--texto-suave);line-height:1.7;padding:0 20px}
.faq-a.open{max-height:140px;padding:0 20px 16px}

/* FOOTER */
.footer{background:var(--marrom);color:var(--bege);padding:2.5rem 2rem 1.5rem;margin-top:4rem}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding-bottom:1.5rem;margin-bottom:1.5rem;border-bottom:1px solid rgba(246,235,221,.12)}
.footer-logo-img{height:40px;width:auto}
.footer-tagline{font-size:12px;color:rgba(246,235,221,.5);margin-top:2px}
.footer-social-icons{display:flex;gap:10px}
.footer-social-btn{width:38px;height:38px;border-radius:50%;background:rgba(246,235,221,.1);border:1px solid rgba(246,235,221,.15);display:flex;align-items:center;justify-content:center;color:var(--bege);font-size:17px;cursor:pointer;transition:background .2s,transform .2s;text-decoration:none}
.footer-social-btn:hover{background:rgba(246,235,221,.22);transform:translateY(-2px)}
.footer-copy{font-size:11px;color:rgba(246,235,221,.35);text-align:center}

/* WHATSAPP FLOAT */
.whatsapp-float{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;align-items:center;gap:0;cursor:pointer;text-decoration:none}
.whatsapp-float-bubble{background:var(--branco);color:var(--marrom);font-size:12px;font-family:'Jost',sans-serif;padding:8px 14px;border-radius:20px 0 0 20px;box-shadow:0 4px 20px rgba(0,0,0,.12);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(0,0,0,.08)}
.whatsapp-float:hover .whatsapp-float-bubble{opacity:1}
.whatsapp-float-btn{width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;box-shadow:0 6px 24px rgba(37,211,102,.35);animation:pulse-wa 2.5s ease-in-out infinite}
@keyframes pulse-wa{0%,100%{box-shadow:0 6px 24px rgba(37,211,102,.35)}50%{box-shadow:0 6px 32px rgba(37,211,102,.6)}}

/* TOAST */
.toast{position:fixed;bottom:100px;right:24px;z-index:999;background:var(--marrom);color:var(--bege);border-radius:20px;padding:12px 20px;font-size:13px;font-family:'Jost',sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-links,.header-search{display:none}
  .hero-overlay-content{padding:2rem}
  .about-wrapper{grid-template-columns:1fr;margin:0 1rem;padding:2rem 1.5rem}
  .social-section{margin:3rem 1rem 0;padding:2rem 1.5rem}
  .contact-grid{grid-template-columns:1fr}
  .section{padding:3rem 1rem}
  .products-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:480px){
  .products-grid{grid-template-columns:1fr 1fr}
  .about-wrapper{margin:0 .5rem}
  .social-section{margin:3rem .5rem 0}
  .cart-sidebar{width:100%;right:-100%}
}
</style>
</head>

function renderProducts(filter) {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';

    p.name.toLowerCase().includes(filter.toLowerCase()) ||
    (lang==='en'?p.catEN:p.cat).toLowerCase().includes(filter.toLowerCase())
  ) : products;

    const card = document.createElement('div');
    card.className = 'product-card';

    let imgHTML;
    if (p.img) {
      imgHTML = `<img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`;
    } else {
      imgHTML = `<div class="placeholder-wrap">
        <span class="emoji">${p.emoji}</span>
        <span class="photo-hint">📷 Substituir por foto real<br><code style="font-size:9px">img: null → 'url-da-foto'</code></span>
      </div>`;
    }
    card.innerHTML = `
      <div class="product-img" style="background:${p.bg}">
        ${imgHTML}
        <span class="product-badge">Handmade</span>
        <button class="product-fav${isFav?' faved':''}" onclick="toggleFav(${p.id},this,event)" aria-label="Favoritar ${p.name}">
          <i class="ti ti-star${isFav?'-filled':''}"></i>
        </button>
      </div>

        <h3 class="product-name">${lang==='en'?p.nameEN:p.name}</h3>
        <p class="product-desc">${lang==='en'?p.descEN:p.desc}</p>

          <i class="ti ti-shopping-bag-plus"></i> ${t('add_btn')}
        </button>
      </div>`;

}

// ============================================================
// CARRINHO
// ============================================================
function addToCart(id) {
  const p = products.find(x=>x.id===id);
  const item = cart.find(x=>x.id===id);
  if (item) { item.qty++; } else {
    cart.push({id,name:p.name,priceBRL:p.priceBRL,priceUSD:p.priceUSD,qty:1,emoji:p.emoji,img:p.img});
  }
  updateCartBadge();
  showToast(`${p.name} ${t('added_toast')}`);
  renderCart();
}

function changeQty(id, delta) {
  const item = cart.find(x=>x.id===id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    const name = item.name;
    cart = cart.filter(x=>x.id!==id);
    showToast(`${name} ${t('removed_toast')}`);
  }
  updateCartBadge();
  renderCart();
}

function removeFromCart(id) {
  const item = cart.find(x=>x.id===id);
  if (item) showToast(`${item.name} ${t('removed_toast')}`);
  cart = cart.filter(x=>x.id!==id);
  updateCartBadge();
  renderCart();
}

function updateCartBadge() {
  const total = cart.reduce((s,x)=>s+x.qty,0);
  const badge = document.getElementById('cartBadge');
  badge.style.display = total > 0 ? 'flex' : 'none';
  badge.textContent = total;
}

function renderCart() {
  const el = document.getElementById('cartContent');
  if (cart.length === 0) {
    el.innerHTML = `<div class="cart-empty"><i class="ti ti-shopping-bag"></i>${t('cart_empty')}</div>`;
    return;
  }
  const totalBRL = cart.reduce((s,x)=>s+x.priceBRL*x.qty,0);
  const totalUSD = cart.reduce((s,x)=>s+x.priceUSD*x.qty,0);
  const totalStr = lang==='en' ? 'USD$ '+totalUSD.toFixed(2) : 'R$ '+totalBRL.toFixed(2).replace('.',',');
  let html = '<div class="cart-items">';
  cart.forEach(item => {
    const priceStr = lang==='en' ? 'USD$ '+item.priceUSD.toFixed(2) : 'R$ '+item.priceBRL.toFixed(2).replace('.',',');
    const imgEl = item.img ? `<img src="${item.img}" alt="${item.name}">` : item.emoji;
    html += `<div class="cart-item">
      <div class="cart-item-img">${imgEl}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${priceStr}</div>
        <div class="cart-qty">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <button class="cart-remove" onclick="removeFromCart(${item.id})"><i class="ti ti-trash"></i></button>
    </div>`;
  });
  html += `</div><div class="cart-footer">
    <div class="cart-total"><span>${t('cart_total')}</span><span>${totalStr}</span></div>
    <button class="cart-checkout" onclick="checkoutWA()"><i class="ti ti-brand-whatsapp"></i> ${t('cart_checkout')}</button>
  </div>`;
  el.innerHTML = html;
}

function checkoutWA() {
  if (cart.length===0) return;
  let msg = 'Olá! Gostaria de fazer um pedido:\n\n';
  cart.forEach(item => {
    const price = lang==='en'?'USD$ '+item.priceUSD.toFixed(2):'R$ '+item.priceBRL.toFixed(2).replace('.',',');
    msg += `• ${item.name} x${item.qty} (${price})\n`;
  });
  window.open('https://wa.me/5511999999999?text='+encodeURIComponent(msg),'_blank');
}

function openCart() {
  document.getElementById('cartSidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  renderCart();
}
function closeCart() {
  document.getElementById('cartSidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

  e.stopPropagation();
  if (favorites.has(id)) {
    favorites.delete(id);
    showToast(products.find(x=>x.id===id).name+' '+t('unfaved_toast'));
  } else {
    favorites.add(id);
    showToast(products.find(x=>x.id===id).name+' '+t('faved_toast'));
  }
  renderProducts();
  updateFavSection();
}

function updateFavSection() {
  const section = document.getElementById('favSection');
  const chips = document.getElementById('favChips');
  if (favorites.size===0) { section.classList.remove('has-favs'); return; }
  section.classList.add('has-favs');
  chips.innerHTML = '';
  favorites.forEach(id => {
    const p = products.find(x=>x.id===id);
    if (!p) return;
    const chip = document.createElement('div');
    chip.className = 'fav-chip';
    chip.innerHTML = `${p.img ? `<img src="${p.img}" style="width:20px;height:20px;border-radius:4px;object-fit:cover">` : p.emoji} ${p.name}`;
    chip.onclick = () => document.getElementById('produtos').scrollIntoView({behavior:'smooth'});
    chips.appendChild(chip);
  });
}

// ============================================================
// BUSCA
// ============================================================
function handleSearch(val) {
  const dd = document.getElementById('searchDropdown');
  if (!val || val.length < 1) { dd.classList.remove('visible'); return; }
  const results = products.filter(p =>
    p.name.toLowerCase().includes(val.toLowerCase()) ||
    p.cat.toLowerCase().includes(val.toLowerCase()) ||
    p.catEN.toLowerCase().includes(val.toLowerCase())
  );
  if (results.length===0) {
    dd.innerHTML = `<div class="search-no-results">Nenhum produto encontrado</div>`;
  } else {
    dd.innerHTML = results.map(p => `
      <div class="search-item" onclick="goToProduct(${p.id})">
        <div class="search-item-img">${p.img ? `<img src="${p.img}" alt="${p.name}">` : p.emoji}</div>
        <div class="search-item-info">
          <div class="search-item-name">${p.name}</div>
          <div class="search-item-price">${formatPrice(p)}</div>
        </div>
      </div>`).join('');
  }
  dd.classList.add('visible');
}

function closeSearch() {
  document.getElementById('searchDropdown').classList.remove('visible');
  document.getElementById('searchInput').value = '';
}

function goToProduct(id) {
  closeSearch();
  document.getElementById('produtos').scrollIntoView({behavior:'smooth'});
}

// ============================================================
// MENUS
// ============================================================
function openMenu() { document.getElementById('mobileMenu').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeMenu() { document.getElementById('mobileMenu').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
function closeAll() { closeMenu(); closeCart(); }

// ============================================================
// FAQ
// ============================================================
function toggleFaq(btn) {
  const a = btn.nextElementSibling;
  const open = a.classList.toggle('open');
  btn.classList.toggle('open', open);
}

// ============================================================
// FORMULÁRIO
// ============================================================
function sendForm(e) {
  e.preventDefault();
  const nome = document.getElementById('nome').value;
  const msg = document.getElementById('msg').value;
  window.open('https://wa.me/5511999999999?text='+encodeURIComponent(`Olá! Meu nome é ${nome}. ${msg}`),'_blank');
  document.getElementById('form-feedback').style.display = 'block';
  e.target.reset();
}

// ============================================================
// SCROLL SUAVE
// ============================================================
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    const t = document.querySelector(a.getAttribute('href'));
    if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth',block:'start'}); closeAll(); }
  });
});

// INIT
renderProducts();
applyTranslations();
</script>
</body>
</html>
